# Release gates (codex review 2026-07-22, P0): every push/PR must pass the
# same commands a release would — tests, fmt, all-target clippy, the payload
# contract checker, and `cargo package` for all three crates. Linux + macOS
# matrix because both are supported install targets.
name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (all targets, warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Payload contract checker
        run: python3 scripts/check_payloads.py
      # --no-verify: sumcp-cli embeds the debrief skill from the repo-level
      # skills/ dir via include_str!, which a from-package verify build can't
      # see. v0.1 distributes prebuilt archives, not crates.io publishes
      # (codex review P0); this gate only proves the manifests stay packageable.
      - name: Package (manifest sanity)
        if: matrix.os == 'ubuntu-latest'
        run: cargo package -p sumcp-core -p sumcp-cli -p sumcp-mcp --no-verify --allow-dirty

  # The release workflow's `publish` job depends on ALL build targets, so a
  # musl build that only breaks at tag time would block the whole release
  # after every other archive had already succeeded. Proving the target
  # compiles on every push means tagging is never the moment we find out.
  # Build only: the release workflow owns packaging and the staticness
  # assertion.
  musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Install musl build tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Build both binaries for musl
        run: cargo build --locked --release --target x86_64-unknown-linux-musl -p sumcp-cli -p sumcp-mcp
      - name: Assert the binaries are statically linked
        run: |
          set -euo pipefail
          for b in sumcp sumcp-mcp; do
            path="./target/x86_64-unknown-linux-musl/release/${b}"
            file "$path"
            file "$path" | grep -q "statically linked" \
              || { echo "::error::${b} is not statically linked"; exit 1; }
          done

  # A declared MSRV that nothing checks is just a comment. `rust-version` is
  # 1.88 because let-chains (used throughout ingest/signals) stabilized there;
  # 1.87 fails with E0658. This job builds and tests on exactly that floor, so
  # using a newer language feature breaks CI instead of silently breaking
  # users who are pinned to an older toolchain.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Build and test on the declared MSRV
        run: cargo test --workspace --locked
