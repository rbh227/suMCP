# Release gates (codex review 2026-07-22, P0): every push/PR must pass the
# same commands a release would — tests, fmt, all-target clippy, the payload
# contract checker, and `cargo package` for all three crates. Linux + macOS
# matrix because both are supported install targets.
name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (all targets, warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Payload contract checker
        run: python3 scripts/check_payloads.py
      # --no-verify: sumcp-cli embeds the debrief skill from the repo-level
      # skills/ dir via include_str!, which a from-package verify build can't
      # see. v0.1 distributes prebuilt archives, not crates.io publishes
      # (codex review P0); this gate only proves the manifests stay packageable.
      - name: Package (manifest sanity)
        if: matrix.os == 'ubuntu-latest'
        run: cargo package -p sumcp-core -p sumcp-cli -p sumcp-mcp --no-verify --allow-dirty
