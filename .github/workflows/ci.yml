# Release gates (codex review 2026-07-22, P0): every push/PR must pass the
# same commands a release would — tests, fmt, all-target clippy, the payload
# contract checker, and `cargo package` for all three crates. Linux + macOS
# matrix because both are supported install targets.
name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (all targets, warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Payload contract checker
        run: python3 scripts/check_payloads.py
      # --no-verify: sumcp-cli embeds the debrief skill from the repo-level
      # skills/ dir via include_str!, which a from-package verify build can't
      # see. v0.1 distributes prebuilt archives, not crates.io publishes
      # (codex review P0); this gate only proves the manifests stay packageable.
      - name: Package (manifest sanity)
        if: matrix.os == 'ubuntu-latest'
        run: cargo package -p sumcp-core -p sumcp-cli -p sumcp-mcp --no-verify --allow-dirty

  # The Intel macOS archive is cross-compiled from an arm64 runner, so nothing
  # ever EXECUTED it: a binary that links but crashes on startup would have
  # shipped. Rosetta 2 is present on GitHub's arm64 macOS runners, so
  # `arch -x86_64` runs the cross-built binary on the same machine that built
  # it. This job exists to keep that claim honest on every push rather than
  # discovering it from a user's crash report.
  #
  # If this job ever fails because Rosetta is gone, do NOT delete the job:
  # either publish the Intel archive as untested and say so in the README, or
  # stop publishing it. Silently shipping an unexecuted binary is the thing
  # this prevents.
  macos-x86-smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Confirm the runner is arm64 and Rosetta can run x86-64
        run: |
          set -euo pipefail
          echo "runner arch: $(uname -m)"
          if [ "$(uname -m)" != "arm64" ]; then
            echo "::notice::runner is already x86-64, so this target is native here"
          elif ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "::error::Rosetta 2 is unavailable, so the Intel binary cannot be executed here"
            exit 1
          else
            echo "Rosetta 2 is available"
          fi
      - name: Build both binaries for x86_64-apple-darwin
        run: cargo build --locked --release --target x86_64-apple-darwin -p sumcp-cli -p sumcp-mcp
      - name: Execute the Intel binary
        run: |
          set -euo pipefail
          bin="./target/x86_64-apple-darwin/release/sumcp"
          file "$bin"
          # Prove the artifact really is x86-64 rather than a silently native build.
          file "$bin" | grep -q "x86_64" || {
            echo "::error::built binary is not x86-64"; exit 1; }
          # The actual point: run it. --version exercises startup, arg parsing,
          # and every statically initialized structure.
          if [ "$(uname -m)" = "arm64" ]; then
            arch -x86_64 "$bin" --version
          else
            "$bin" --version
          fi
          # And run something that touches the real analysis path, not just
          # the version string, on a committed fixture.
          run_bin() { if [ "$(uname -m)" = "arm64" ]; then arch -x86_64 "$@"; else "$@"; fi; }
          run_bin "$bin" --file fixtures/demo/demo-session.jsonl --json > /tmp/out.json
          python3 -c 'import json; d=json.load(open("/tmp/out.json")); assert d["v"]==1, d["v"]; assert d["top_struggles"], "no ranked files"; print("Intel binary analyzed the fixture:", d["top_struggles"][0]["file"])'
          test -x "./target/x86_64-apple-darwin/release/sumcp-mcp"

  # The release workflow's `publish` job depends on ALL build targets, so a
  # musl build that only breaks at tag time would block the whole release
  # after every other archive had already succeeded. Proving the target
  # compiles on every push means tagging is never the moment we find out.
  # Build only: the release workflow owns packaging and the staticness
  # assertion.
  musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Install musl build tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Build both binaries for musl
        run: cargo build --locked --release --target x86_64-unknown-linux-musl -p sumcp-cli -p sumcp-mcp
      - name: Assert the binaries are statically linked
        run: |
          set -euo pipefail
          for b in sumcp sumcp-mcp; do
            path="./target/x86_64-unknown-linux-musl/release/${b}"
            file "$path"
            # Rust's musl target emits a static-pie (static position
            # independent executable), which `file` labels "static-pie
            # linked", not "statically linked". Both are static; accept
            # either. Matching only the latter rejects every real musl build.
            file "$path" | grep -qE "statically linked|static-pie linked" \
              || { echo "::error::${b} is not statically linked"; exit 1; }
            # Belt and braces: a dynamic executable resolves libraries, which
            # ldd prints as "libfoo.so => /path". No arrows means nothing to
            # resolve. This catches a build that `file` mislabels.
            if ldd "$path" 2>&1 | grep -q "=>"; then
              echo "::error::${b} has dynamic library dependencies:"
              ldd "$path" || true
              exit 1
            fi
          done

  # A declared MSRV that nothing checks is just a comment. `rust-version` is
  # 1.88 because let-chains (used throughout ingest/signals) stabilized there;
  # 1.87 fails with E0658. This job builds and tests on exactly that floor, so
  # using a newer language feature breaks CI instead of silently breaking
  # users who are pinned to an older toolchain.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Build and test on the declared MSRV
        run: cargo test --workspace --locked
