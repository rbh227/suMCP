[package]
name = "backstory-cli"
description = "backstory-mcp command-line interface: instant session debrief, HTML report, install"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "backstory"
path = "src/main.rs"

[dependencies]
backstory-core = { path = "../backstory-core", version = "0.2.0" }
clap = { version = "4", features = ["derive"] }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3.27.0"
