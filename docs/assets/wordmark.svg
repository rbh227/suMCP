<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 184" role="img" aria-labelledby="t">
  <title id="t">backstory-mcp: the session, quoted verbatim, for the reviewing agent</title>
  <style>
    .tw { font-family: 'American Typewriter', 'Courier Prime', 'Courier New', monospace; }
    @keyframes typein { from { clip-path: inset(-10% 100% -10% 0); } to { clip-path: inset(-10% -6% -10% 0); } }
    .word { animation: typein 0.9s steps(10, end) 0.15s both; }
    @keyframes blink { 50% { opacity: 0; } }
    .caret { animation: blink 1.1s steps(1) 1.3s infinite; }
    @keyframes stampin {
      from { opacity: 0; transform: scale(1.9); }
      to   { opacity: 1; transform: scale(1); }
    }
    .stamp {
      transform-box: fill-box; transform-origin: center;
      animation: stampin 0.35s cubic-bezier(0.2, 1.4, 0.4, 1) 1.15s both;
    }
    @media (prefers-reduced-motion: reduce) {
      .word, .caret, .stamp { animation: none; }
    }
  </style>

  <!-- folder shadow -->
  <rect x="10" y="52" width="620" height="126" rx="12" fill="#2A2018" opacity="0.14"/>

  <!-- folder tab -->
  <rect x="26" y="22" width="230" height="34" rx="8" fill="#E9DCB5" stroke="#C7AE78" stroke-width="1.5"/>

  <!-- folder body -->
  <rect x="8" y="46" width="624" height="126" rx="12" fill="#E9DCB5" stroke="#C7AE78" stroke-width="1.5"/>

  <!-- hide the seam where tab meets body -->
  <rect x="28" y="41" width="226" height="12" fill="#E9DCB5"/>

  <!-- tab label -->
  <text class="tw" x="46" y="43" font-size="11" font-weight="bold" letter-spacing="2" fill="#6B5C48">CASE FILE<tspan fill="#1C6E5E"> &#183; MCP SERVER</tspan></text>

  <!-- wordmark, typed in, with a blinking caret -->
  <text class="tw word" x="40" y="122" font-size="56" font-weight="bold" fill="#2A2018">backstory<tspan class="caret" fill="#B3372F">&#9612;</tspan></text>

  <!-- tagline -->
  <text class="tw" x="42" y="152" font-size="13.5" fill="#6B5C48">the session, quoted verbatim, for the reviewing agent</text>

  <!-- provenance note -->
  <text class="tw" x="620" y="166" text-anchor="end" font-size="10" fill="#6B5C48" opacity="0.75">formerly suMCP</text>

  <!-- the stamp -->
  <g transform="translate(497,96) rotate(-9)">
    <g class="stamp" opacity="0.92">
      <rect x="-92" y="-28" width="184" height="56" rx="10" fill="none" stroke="#B3372F" stroke-width="2.5"/>
      <rect x="-85" y="-21" width="170" height="42" rx="7" fill="none" stroke="#B3372F" stroke-width="1.25"/>
      <text class="tw" x="0" y="5.5" text-anchor="middle" font-size="14" font-weight="bold" letter-spacing="2" fill="#B3372F">ON THE RECORD</text>
    </g>
  </g>
</svg>
